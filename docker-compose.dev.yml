services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    ports:
      - "${PORT_DB}:5432"
    environment:
      POSTGRES_USER: carbon
      POSTGRES_PASSWORD: carbon
      POSTGRES_DB: carbon
    volumes:
      - pgdata:/var/lib/postgresql
      - ./packages/dev/docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbon -d carbon"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${PORT_STORAGE}:9000"
      - "${PORT_CONSOLE}:9001"
    environment:
      MINIO_ROOT_USER: carbon
      MINIO_ROOT_PASSWORD: carbon-password
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  createbuckets:
    image: minio/mc:latest
    environment:
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -eu;
      mc alias set local http://minio:9000 carbon carbon-password;
      mc mb -p local/$${S3_PRIVATE_BUCKET};
      mc mb -p local/$${S3_PUBLIC_BUCKET};
      mc anonymous set download local/$${S3_PUBLIC_BUCKET};
      exit 0;
      "

  inbucket:
    image: inbucket/inbucket:3.1.1
    restart: unless-stopped
    ports:
      - "${PORT_INBUCKET}:9000"

  inngest:
    image: inngest/inngest:v1.18.0
    restart: unless-stopped
    ports:
      - "${PORT_INNGEST}:8288"
    command:
      - inngest
      - dev
      - --sdk-url=${ERP_URL}/api/inngest
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/portless-ca.pem
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${INNGEST_TLS_HOST}:host-gateway"
    volumes:
      - inngest:/data
      - ${HOME}/.portless/ca.pem:/etc/ssl/certs/portless-ca.pem:ro

volumes:
  pgdata:
  minio:
  inngest:
