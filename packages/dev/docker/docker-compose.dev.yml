###
# Worktree-isolated dev stack. Boot via `npm run dev:up` (see packages/dev/src/cli.ts).
# COMPOSE_PROJECT_NAME=carbon-<slug> namespaces every container, network, volume.
# Required env (provided by .env via --env-file): PORT_*,
# CARBON_AUTH_JWT_SECRET, CARBON_PUBLIC_KEY, CARBON_SERVICE_ROLE_KEY,
# plus user secrets passed through.
###

services:
  postgres:
    image: supabase/postgres:15.14.1.112
    restart: unless-stopped
    networks:
      default:
        aliases:
          - db
    ports:
      - "${PORT_DB}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_PASSWORD: postgres
      PGPASSWORD: postgres
      JWT_SECRET: ${CARBON_AUTH_JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgconfig:/etc/postgresql-custom
      - ./packages/dev/docker/init.sql:/docker-entrypoint-initdb.d/zz-carbon-roles.sql:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v13.0.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${CARBON_AUTH_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${CARBON_AUTH_JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  realtime:
    image: supabase/realtime:v2.89.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
        aliases:
          - realtime-dev
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${CARBON_AUTH_JWT_SECRET}
      METRICS_JWT_SECRET: ${CARBON_AUTH_JWT_SECRET}
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      APP_NAME: realtime
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  inbucket:
    image: inbucket/inbucket:3.1.1
    restart: unless-stopped
    ports:
      - "${PORT_INBUCKET}:9000"

  edge-runtime:
    image: supabase/edge-runtime:v1.74.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JWT_SECRET: ${CARBON_AUTH_JWT_SECRET}
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${CARBON_PUBLIC_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${CARBON_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:postgres@postgres:5432/postgres
      CARBON_API_URL: http://kong:8000
      CARBON_PUBLIC_KEY: ${CARBON_PUBLIC_KEY}
      CARBON_SERVICE_ROLE_KEY: ${CARBON_SERVICE_ROLE_KEY}
      CARBON_AUTH_JWT_SECRET: ${CARBON_AUTH_JWT_SECRET}
      CARBON_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      VERIFY_JWT: "false"
      # Backups edge fns (export/import/revert) send Inngest events. The edge
      # runtime is a separate env from the ERP app, so without these its
      # inngest.send() defaults to Inngest Cloud → 401. Point it at the local
      # dev server via the compose-network alias (NOT localhost — that's the
      # edge container itself).
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: http://inngest:8288
    volumes:
      - ./packages/database/supabase/functions:/home/deno/functions:ro
      - ./packages/database/src:/home/src:ro
      # Dev-only dispatcher; lives outside supabase/functions/ so prod
      # `supabase functions deploy --all` can't pick it up.
      - ./packages/dev/docker/edge-main:/home/deno/main:ro
    command:
      - start
      - --main-service
      - /home/deno/main

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      - postgrest
      - realtime
      - edge-runtime
    ports:
      - "${PORT_API}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
    volumes:
      - ./packages/dev/docker/kong.yml:/home/kong/kong.yml:ro

  # Redis is shared across worktrees — booted directly as the `carbon-redis`
  # container by the dev CLI (packages/dev/src/services/compose.ts), not here.
  # Each worktree gets its own logical DB index (0-15) via REDIS_URL.

  inngest:
    image: inngest/inngest:v1.19.4
    restart: unless-stopped
    ports:
      - "${PORT_INNGEST}:8288"
    command:
      - inngest
      - dev
      - --sdk-url=${ERP_URL}/api/inngest
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/portless-ca.pem
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${INNGEST_TLS_HOST}:host-gateway"
    volumes:
      - inngest:/data
      - ${HOME}/.portless/ca.pem:/etc/ssl/certs/portless-ca.pem:ro

volumes:
  pgdata:
  pgconfig:
  inngest:
